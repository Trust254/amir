<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amir Marketplace</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f4f4f4; padding-bottom: 80px; }
        
        .header { background: #111; color: #fff; padding: 15px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .header h1 { font-size: 18px; font-weight: bold; }
        .header-btns button { background: #25D366; color: #fff; border: none; padding: 8px 14px; border-radius: 4px; font-weight: bold; cursor: pointer; }
        
        .container { padding: 15px; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
        .card { background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.08); display: flex; flex-direction: column; justify-content: space-between; }
        .card img { width: 100%; height: 160px; object-fit: cover; background: #eee; }
        .card-details { padding: 10px; }
        .card-title { font-size: 14px; font-weight: bold; color: #333; margin-bottom: 4px; }
        .price-tag { font-size: 15px; color: #e62e00; font-weight: bold; }
        .fee-badge { font-size: 10px; color: #666; background: #eee; padding: 2px 4px; border-radius: 3px; display: inline-block; margin-top: 2px; }
        .actions { padding: 10px; border-top: 1px solid #eee; display: flex; gap: 5px; }
        .btn { flex: 1; padding: 8px; border: none; border-radius: 4px; font-size: 12px; font-weight: bold; cursor: pointer; text-align: center; }
        .btn-buy { background: #25D366; color: #fff; }
        .btn-share { background: #007bff; color: #fff; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 200; justify-content: center; align-items: center; }
        .modal-content { background: #fff; padding: 20px; border-radius: 8px; width: 90%; max-width: 400px; }
        .modal-content h2 { margin-bottom: 15px; font-size: 16px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { font-size: 12px; font-weight: bold; display: block; margin-bottom: 4px; }
        .form-group input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        .modal-btns { display: flex; gap: 10px; margin-top: 15px; }
        .btn-submit { background: #111; color: #fff; flex: 1; padding: 10px; border: none; border-radius: 4px; cursor: pointer; }
        .btn-close { background: #ccc; color: #333; padding: 10px; border: none; border-radius: 4px; cursor: pointer; }

        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid #ccc; display: flex; justify-content: space-around; padding: 12px 0; }
        .nav-link { color: #333; text-decoration: none; font-size: 12px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Amir Store</h1>
        <div class="header-btns">
            <button onclick="openModal()">+ Post Item</button>
        </div>
    </div>

    <div class="container">
        <div class="product-grid" id="productGrid">
            
            <!-- VERIFIED ITEM 1 (Example Cap) -->
            <div class="card">
                <img src="Screenshot_20260827_113014.jpg" alt="Men's Cap">
                <div class="card-details">
                    <div class="card-title">Men's Outdoor Cap</div>
                    <div class="price-tag">KSh 1,224</div>
                    <div class="fee-badge">Includes 2% Maint. Fee</div>
                </div>
                <div class="actions">
                    <button class="btn btn-buy" onclick="buyItem('Men\'s Outdoor Cap', '1224')">Buy Now</button>
                    <button class="btn btn-share" onclick="shareSite()">Share</button>
                </div>
            </div>

<div class="card">
    <img src="Screenshot_20260827_113014.jpg" alt="Product">
    <div class="card-details">
        <div class="card-title">Men's Cap</div>
        <div class="price-tag">KSh 1,224</div>
        <div class="fee-badge">Includes 2% Maint. Fee</div>
    </div>
    <div class="actions">
        <button class="btn btn-buy" onclick="buyItem('Men\'s Cap', '1224')">Buy Now</button>
        <button class="btn btn-share" onclick="shareSite()">Share</button>
    </div>

        </div>
    </div>

    <!-- Seller Submission Form -->
    <div class="modal" id="sellModal">
        <div class="modal-content">
            <h2>Post Item for Admin Approval</h2>
            <div class="form-group">
                <label>Item Name</label>
                <input type="text" id="itemName" placeholder="e.g. Leather Jacket">
            </div>
            <div class="form-group">
                <label>Your Selling Price (KSh)</label>
                <input type="number" id="itemPrice" placeholder="1000" oninput="calculatePrice()">
            </div>
            <div class="form-group">
                <label>Listed Price (+2% Admin/Sharon Fee):</label>
                <input type="text" id="finalPriceDisplay" readonly placeholder="KSh 0">
            </div>
            <div class="form-group">
                <label>Image Filename Uploaded to GitHub</label>
                <input type="text" id="itemImage" placeholder="e.g. cap.jpg">
            </div>
            <div class="modal-btns">
                <button class="btn-submit" onclick="submitForVerification()">Send to Admin WhatsApp</button>
                <button class="btn-close" onclick="closeModal()">Cancel</button>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <a href="#" class="nav-link">Home</a>
        <a href="#" class="nav-link" onclick="openModal()">Sell Item</a>
        <a href="mailto:abdiabdulmohammed50@gmail.com" class="nav-link">Email Us</a>
        <a href="#" class="nav-link" onclick="shareSite()">Share Store</a>
    </div>

    <script>
        const SHARON_WHATSAPP = "254719222390";
        const ADMIN_WHATSAPP = "254795653284";

        function openModal() { document.getElementById('sellModal').style.display = 'flex'; }
        function closeModal() { document.getElementById('sellModal').style.display = 'none'; }

        function calculatePrice() {
            const basePrice = parseFloat(document.getElementById('itemPrice').value) || 0;
            const finalPrice = basePrice * 1.02; // Automatic 2% Markup
            document.getElementById('finalPriceDisplay').value = "KSh " + finalPrice.toFixed(2);
        }

        function submitForVerification() {
            const name = document.getElementById('itemName').value;
            const basePrice = parseFloat(document.getElementById('itemPrice').value) || 0;
            const finalPrice = (basePrice * 1.02).toFixed(2);
            const fee = (basePrice * 0.02).toFixed(2);
            const img = document.getElementById('itemImage').value;

            if (!name || !basePrice || !img) {
                alert("Please fill out all fields.");
                return;
            }

            const message = `*NEW ITEM SUBMISSION FOR APPROVAL*%0A%0A` +
                `*Item:* ${encodeURIComponent(name)}%0A` +
                `*Seller Price:* KSh ${basePrice}%0A` +
                `*Store Price (+2%):* KSh ${finalPrice}%0A` +
                `*Sharon Maintenance Fee:* KSh ${fee}%0A` +
                `*Image File:* ${img}%0A%0A` +
                `Admins (+254795653284 / +254719222390), please verify payment and add to GitHub!`;

            window.open(`https://wa.me/${SHARON_WHATSAPP}?text=${message}`, '_blank');
            closeModal();
        }

        function buyItem(name, price) {
            const message = `Hello, I want to purchase: *${encodeURIComponent(name)}* listed at *KSh ${price}*. Please verify payment and seller connection.`;
            window.open(`https://wa.me/${ADMIN_WHATSAPP}?text=${message}`, '_blank');
        }

        function shareSite() {
            if (navigator.share) {
                navigator.share({ title: 'Amir Store', text: 'Shop directly on Amir Store Online!', url: window.location.href });
            } else {
                navigator.clipboard.writeText(window.location.href);
                alert("Store link copied to clipboard!");
            }
        }
    </script>
</body>
</html>
